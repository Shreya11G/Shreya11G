</text>

<text x="407" y="153"
  fill="#FF69B4" filter="url(#pinkGlow)"
  font-family="Arial" font-size="30" font-weight="700">
  0
</text>

<rect x="735" y="75" width="310" height="110"
  rx="14" fill="#171117" stroke="#4A1E3A"/>

<text x="757" y="110"
  fill="#B8A6B1" font-family="Arial" font-size="14">
  Commits
</text>

<text x="757" y="153"
  fill="#FF69B4" filter="url(#pinkGlow)"
  font-family="Arial" font-size="30" font-weight="700">
  70
</text>

<rect x="35" y="215" width="310" height="110"
  rx="14" fill="#171117" stroke="#4A1E3A"/>

<text x="57" y="250"
  fill="#B8A6B1" font-family="Arial" font-size="14">
  Pull Requests
</text>

<text x="57" y="293"
  fill="#FF69B4" filter="url(#pinkGlow)"
  font-family="Arial" font-size="30" font-weight="700">
  0
</text>

<rect x="385" y="215" width="310" height="110"
  rx="14" fill="#171117" stroke="#4A1E3A"/>

<text x="407" y="250"
  fill="#B8A6B1" font-family="Arial" font-size="14">
  Merged PRs
</text>

<text x="407" y="293"
  fill="#FF69B4" filter="url(#pinkGlow)"
  font-family="Arial" font-size="30" font-weight="700">
