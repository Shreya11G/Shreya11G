<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330">
  <defs>
    <linearGradient id="pink" x1="0" x2="1">
      <stop offset="0%" stop-color="#ff69b4"/>
      <stop offset="100%" stop-color="#ff1493"/>
    </linearGradient>

    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <clipPath id="line1"><rect x="70" y="0" width="0" height="40"><animate attributeName="width" values="0;470;470;0" keyTimes="0;0.08;0.22;0.30" dur="10s" repeatCount="indefinite"/></rect></clipPath>
    <clipPath id="line2"><rect x="70" y="0" width="0" height="40"><animate attributeName="width" values="0;590;590;0" keyTimes="0;0.08;0.22;0.30" dur="10s" begin="1.8s" repeatCount="indefinite"/></rect></clipPath>
    <clipPath id="line3"><rect x="70" y="0" width="0" height="40"><animate attributeName="width" values="0;920;920;0" keyTimes="0;0.08;0.22;0.30" dur="10s" begin="3.6s" repeatCount="indefinite"/></rect></clipPath>
    <clipPath id="line4"><rect x="70" y="0" width="0" height="40"><animate attributeName="width" values="0;610;610;0" keyTimes="0;0.08;0.22;0.30" dur="10s" begin="5.4s" repeatCount="indefinite"/></rect></clipPath>
  </defs>

  <rect width="1200" height="330" rx="22" fill="#0d1117"/>
  <rect x="2" y="2" width="1196" height="326" rx="20" fill="none" stroke="#ff69b4" stroke-opacity="0.65" stroke-width="2"/>

  <!-- terminal header -->
  <rect x="2" y="2" width="1196" height="48" rx="20" fill="#16121c"/>
  <circle cx="30" cy="26" r="7" fill="#ff5f56"/>
  <circle cx="54" cy="26" r="7" fill="#ffbd2e"/>
  <circle cx="78" cy="26" r="7" fill="#27c93f"/>
  <text x="105" y="32" fill="#b9a8b5" font-family="monospace" font-size="17">shreya@developer:~</text>

  <!-- title -->
  <text x="70" y="88" fill="url(#pink)" font-family="monospace" font-size="18" font-weight="bold">
    &gt; whoami
  </text>

  <!-- sequential typewriter lines -->
  <g font-family="monospace" font-size="24" fill="#f7f3f6">
    <g clip-path="url(#line1)">
      <text x="70" y="135">&gt; Software Engineer</text>
    </g>
    <g clip-path="url(#line2)">
      <text x="70" y="180">&gt; Building scalable projects</text>
    </g>
    <g clip-path="url(#line3)">
      <text x="70" y="225">&gt; Java | JavaScript | TypeScript | React | Node.js | AWS</text>
    </g>
    <g clip-path="url(#line4)">
      <text x="70" y="270">&gt; Open Source Contributor</text>
    </g>
  </g>

  <!-- blinking cursor -->
  <rect x="70" y="286" width="13" height="25" rx="1" fill="#ff69b4" filter="url(#glow)">
    <animate attributeName="opacity" values="1;1;0;0;1" dur="1s" repeatCount="indefinite"/>
    <animate attributeName="x" values="70;540;540;70;70" keyTimes="0;0.22;0.30;0.78;1" dur="10s" repeatCount="indefinite"/>
  </rect>

  <text x="1080" y="310" text-anchor="end" fill="#ff69b4" opacity="0.75"
        font-family="monospace" font-size="13">build • learn • grow</text>
</svg>
